name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest -q --cov=src/voice_duck --cov-report=term-missing --cov-fail-under=85

      - name: Build distribution (smoke test)
        run: |
          uv pip install --system build
          python -m build

      - name: Verify wheel installs and imports
        run: |
          uv pip install --system dist/*.whl --force-reinstall
          python -c "import voice_duck; print(voice_duck.__version__)"
